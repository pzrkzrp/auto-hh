services:
  mongo:
    image: mongo:7
    container_name: autohh-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

  mongo-express:
    image: mongo-express:latest
    container_name: autohh-mongo-express
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_SERVER: mongo
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin
    depends_on:
      - mongo
    restart: unless-stopped

  redis:
    # Используем стабильную версию Redis на основе Alpine (легкий образ)
    image: redis:7.2-alpine
    container_name: redis
    restart: unless-stopped

    # Пробрасываем стандартный порт наружу
    ports:
      - "6379:6379"

    # Монтируем том для сохранения данных
    volumes:
      - redis_data:/data

    # Задаем пароль и включаем AOF для сохранности данных [citation:1][citation:10]
    command: >
      redis-server
      --requirepass your_strong_password_here
      --appendonly yes

    # Проверка, что сервер жив
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "your_strong_password_here", "ping" ]
      interval: 10s
      timeout: 3s
      retries: 5
volumes:
  mongo-data:
  redis_data:
    driver: local
