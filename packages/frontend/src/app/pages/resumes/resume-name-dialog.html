<h2 mat-dialog-title>Название резюме</h2>
<mat-dialog-content>
  <p class="hint">Под этим именем резюме появится в списке и на вкладке «Резюме» конфигурации.</p>
  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Имя резюме</mat-label>
    <input matInput [formField]="nameForm.name" placeholder="Например, «Backend Middle»" autofocus />
  </mat-form-field>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button (click)="close()">Отмена</button>
  <button mat-raised-button color="primary" (click)="confirm()" [disabled]="!nameForm().valid">Загрузить</button>
</mat-dialog-actions>
