<div class="sidebar">
  <div class="brand">
    <span class="brand-logo">🤖</span>
    <h1 class="brand-title">auto-hh</h1>
  </div>

  <div class="menu-label">МЕНЮ</div>

  <nav class="nav">
    @for (item of navItems; track item.link) {
      <a
        class="nav-item"
        [routerLink]="item.link"
        routerLinkActive="active"
        [attr.aria-label]="item.label"
        [attr.title]="item.label"
      >
        <mat-icon class="nav-icon">{{ item.icon }}</mat-icon>
        <span class="nav-label">{{ item.label }}</span>
      </a>
    }
  </nav>

  <div class="footer">
    @for (item of footerItems; track item.link) {
      <a
        class="nav-item"
        [routerLink]="item.link"
        routerLinkActive="active"
        [attr.aria-label]="item.label"
        [attr.title]="item.label"
      >
        <mat-icon class="nav-icon">{{ item.icon }}</mat-icon>
        <span class="nav-label">{{ item.label }}</span>
      </a>
    }

    <div class="status-chip">
      <mat-icon class="status-icon">check_circle</mat-icon>
      <span>Система активна</span>
    </div>

    <button
      class="theme-toggle"
      (click)="theme.toggle()"
      [attr.aria-label]="theme.dark() ? 'Включить светлую тему' : 'Включить тёмную тему'"
      [attr.title]="theme.dark() ? 'Светлая тема' : 'Тёмная тема'"
    >{{ theme.dark() ? '☀️' : '🌙' }}</button>
  </div>
</div>
